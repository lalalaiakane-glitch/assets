<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雨林資產認購平台</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --sw:210px;--bg:#f5f5f3;--sb:#181818;--sbt:#888;--sba:#fff;
  --card:#fff;--bd:rgba(0,0,0,0.08);--tx:#1a1a1a;--sub:#6b6b6b;
  --ac:#2563eb;--acb:#eff6ff;--am:#d97706;--amb:#fffbeb;
  --gn:#059669;--gnb:#ecfdf5;--rd:#dc2626;--rdb:#fef2f2;
  --r:10px;--rs:6px;
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:var(--tx);background:var(--bg)}

/* ── Login ── */
#loginScreen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:200}
.lcard{background:var(--card);border:0.5px solid var(--bd);border-radius:var(--r);padding:36px 32px;width:380px;box-shadow:0 4px 24px rgba(0,0,0,0.07)}
.llogo{font-size:18px;font-weight:600;margin-bottom:2px}
.lsub{font-size:13px;color:var(--sub);margin-bottom:28px}
.fd{margin-bottom:16px}
.fd label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px}
.fd input{width:100%;padding:9px 11px;border:0.5px solid var(--bd);border-radius:var(--rs);font-size:13px;outline:none;background:#fff;color:var(--tx);transition:border-color .15s}
.fd input:focus{border-color:var(--ac)}
.fd .hint{font-size:11px;color:var(--sub);margin-top:4px}
.orow{display:flex;gap:8px}
.orow input{flex:1}
.orow button{padding:9px 14px;border:0.5px solid var(--bd);border-radius:var(--rs);background:#fff;cursor:pointer;font-size:13px;color:var(--sub);white-space:nowrap;transition:background .15s}
.orow button:hover{background:var(--bg)}
.bp{width:100%;padding:11px;background:var(--ac);color:#fff;border:none;border-radius:var(--rs);font-size:14px;font-weight:500;cursor:pointer;transition:background .15s}
.bp:hover{background:#1d4ed8}
.bam{background:var(--am)!important}.bam:hover{background:#b45309!important}
.lerr{font-size:12px;color:var(--rd);text-align:center;margin-top:8px;display:none}

/* ── App shell ── */
#app{display:none;height:100vh;overflow:hidden}
.shell{display:flex;height:100%}

/* ── Sidebar ── */
.sb{width:var(--sw);background:var(--sb);display:flex;flex-direction:column;flex-shrink:0}
.sbh{padding:20px 16px 14px;border-bottom:1px solid rgba(255,255,255,0.06)}
.sblogo{font-size:14px;font-weight:600;color:#fff}
.sbsub{font-size:11px;color:#555;margin-top:3px}
.sbnav{padding:12px 8px;flex:1;overflow-y:auto}
.nsc{font-size:10px;color:#3a3a3a;text-transform:uppercase;letter-spacing:.08em;padding:0 8px;margin:14px 0 4px}
.ni{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:var(--rs);cursor:pointer;color:var(--sbt);font-size:13px;transition:background .12s;margin-bottom:1px;user-select:none}
.ni:hover{background:rgba(255,255,255,0.06);color:#ccc}
.ni.active{background:rgba(255,255,255,0.1);color:var(--sba)}
.ni i{font-size:15px;flex-shrink:0}
.nbadge{margin-left:auto;background:var(--ac);color:#fff;font-size:10px;padding:1px 6px;border-radius:99px}
.sbft{padding:12px 16px;border-top:1px solid rgba(255,255,255,0.06);font-size:12px;color:#444;display:flex;align-items:center;gap:6px}

/* ── Main ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:52px;background:var(--card);border-bottom:0.5px solid var(--bd);display:flex;align-items:center;gap:12px;padding:0 20px;flex-shrink:0}
.tbtitle{font-size:15px;font-weight:500;flex:1}
.sw{display:flex;align-items:center;gap:6px;background:var(--bg);border:0.5px solid var(--bd);border-radius:var(--rs);padding:6px 10px;width:210px}
.sw input{border:none;background:transparent;font-size:13px;color:var(--tx);outline:none;width:100%}
.sw i{color:var(--sub);font-size:14px;flex-shrink:0}
.chip{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--gn);background:var(--gnb);padding:4px 10px;border-radius:99px}
.cnt{flex:1;overflow-y:auto;padding:20px}
.vw{display:none}.vw.active{display:block}

/* ── Filter bar ── */
.fbar{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.fb{padding:5px 13px;border-radius:99px;border:0.5px solid var(--bd);background:var(--card);color:var(--sub);font-size:12px;cursor:pointer;transition:all .12s}
.fb.active{background:var(--tx);color:#fff;border-color:var(--tx)}
.fb:hover:not(.active){border-color:#aaa;color:var(--tx)}
.fc{margin-left:auto;font-size:12px;color:var(--sub)}

/* ── Product grid ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(256px,1fr));gap:14px}
.pc{background:var(--card);border-radius:var(--r);border:0.5px solid var(--bd);overflow:hidden;cursor:pointer;transition:border-color .12s,transform .12s}
.pc:hover{border-color:rgba(0,0,0,0.2);transform:translateY(-1px)}
.pi{height:136px;display:flex;align-items:center;justify-content:center;position:relative}
.pi i{font-size:52px;color:rgba(0,0,0,0.12)}
.ptag{position:absolute;top:10px;left:10px;font-size:11px;padding:3px 9px;border-radius:99px;font-weight:500}
.ts{background:#dbeafe;color:#1d4ed8}.tp{background:#f3e8ff;color:#6d28d9}
.tb2{background:#fef3c7;color:#92400e}.tdone{background:#f3f4f6;color:#9ca3af}
.qc{position:absolute;top:10px;right:10px;font-size:11px;background:rgba(0,0,0,0.1);color:var(--tx);padding:2px 7px;border-radius:99px}
.pb{padding:12px 14px}
.pn{font-size:14px;font-weight:500;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps{font-size:12px;color:var(--sub);margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf{display:flex;align-items:center;justify-content:space-between}
.pp{font-size:16px;font-weight:600}
.pp span{font-size:12px;font-weight:400;color:var(--sub)}
.ab{font-size:12px;padding:5px 13px;border-radius:var(--rs);border:0.5px solid var(--bd);background:transparent;cursor:pointer;color:var(--tx);transition:background .12s}
.ab:hover{background:var(--bg)}
.abbid{background:var(--amb);border-color:#fcd34d;color:var(--am)}
.brow{width:100%;display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.bamt{font-size:16px;font-weight:600;color:var(--am)}
.bcnt{font-size:11px;color:var(--ac)}
.blab{font-size:11px;color:var(--sub)}
.tmr{font-size:11px;color:var(--rd);display:flex;align-items:center;gap:3px;margin-top:5px}

/* ── Modal ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.38);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:var(--card);border-radius:var(--r);width:500px;max-width:100%;margin:auto}
.mhdr{padding:18px 20px 14px;border-bottom:0.5px solid var(--bd);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--card);border-radius:var(--r) var(--r) 0 0;z-index:1}
.mtitle{font-size:15px;font-weight:500}
.mclose{background:none;border:none;cursor:pointer;color:var(--sub);font-size:20px;padding:2px;line-height:1}
.mbody{padding:20px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.si{background:var(--bg);border-radius:var(--rs);padding:9px 11px}
.si .sl{font-size:11px;color:var(--sub);margin-bottom:2px}
.si .sv{font-size:13px;font-weight:500}
.pline{display:flex;align-items:baseline;gap:8px;margin-bottom:18px}
.pbig{font-size:26px;font-weight:600}
.pnote{font-size:13px;color:var(--sub)}
.fg{margin-bottom:14px}
.fg label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px}
.fg input,.fg textarea{width:100%;padding:9px 11px;border:0.5px solid var(--bd);border-radius:var(--rs);font-size:13px;outline:none;background:#fff;color:var(--tx);font-family:inherit;transition:border-color .15s}
.fg input:focus,.fg textarea:focus{border-color:var(--ac)}
.fg input[readonly]{background:var(--bg);color:var(--sub)}
.fg textarea{resize:vertical;min-height:70px}
.sbar{background:var(--gnb);color:var(--gn);border-radius:var(--rs);padding:10px 14px;font-size:13px;text-align:center;display:none;margin-bottom:12px}
.ebar{background:var(--rdb);color:var(--rd);border-radius:var(--rs);padding:8px 12px;font-size:12px;display:none;margin-bottom:10px}

/* ── Bid modal ── */
.bdisp{background:var(--amb);border:0.5px solid #fcd34d;border-radius:var(--rs);padding:14px;text-align:center;margin-bottom:14px}
.bdl{font-size:11px;color:var(--am);margin-bottom:4px}
.bda{font-size:28px;font-weight:600;color:var(--am)}
.bdc{font-size:12px;color:var(--sub);margin-top:2px}
.cdrow{display:flex;gap:6px;justify-content:center;margin-bottom:16px}
.cdu{text-align:center}
.cdd{font-size:24px;font-weight:600;color:var(--rd);background:var(--rdb);border-radius:var(--rs);padding:6px 10px;min-width:46px;display:block;font-variant-numeric:tabular-nums}
.cdl{font-size:10px;color:var(--sub);margin-top:3px}
.cdsp{font-size:20px;color:var(--rd);align-self:center;padding-bottom:16px}

/* ── Admin ── */
.srow{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.scard{background:var(--card);border:0.5px solid var(--bd);border-radius:var(--r);padding:14px 16px}
.slb{font-size:11px;color:var(--sub);margin-bottom:6px}
.svl{font-size:24px;font-weight:500}
.ssu{font-size:11px;color:var(--sub);margin-top:2px}
.atabs{display:flex;border-bottom:0.5px solid var(--bd)}
.atab{padding:9px 18px;font-size:13px;cursor:pointer;color:var(--sub);border-bottom:2px solid transparent;transition:color .12s}
.atab.active{color:var(--ac);border-bottom-color:var(--ac);font-weight:500}
.atbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.tcard{background:var(--card);border:0.5px solid var(--bd);border-radius:var(--r);overflow:hidden}
.tt{width:100%;border-collapse:collapse;table-layout:fixed}
.tt th{text-align:left;font-size:11px;color:var(--sub);font-weight:500;padding:9px 14px;border-bottom:0.5px solid var(--bd);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.tt td{padding:10px 14px;border-bottom:0.5px solid var(--bd);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt tr:last-child td{border-bottom:none}
.tt tr:hover td{background:var(--bg)}
.bdg{font-size:11px;padding:2px 9px;border-radius:99px;font-weight:500}
.bnew{background:var(--acb);color:var(--ac)}
.etd{text-align:center;padding:36px;color:var(--sub);font-size:13px}
.exbtn{padding:6px 14px;border:0.5px solid var(--bd);border-radius:var(--rs);background:var(--card);cursor:pointer;font-size:12px;color:var(--sub);transition:background .12s}
.exbtn:hover{background:var(--bg)}
.emp{text-align:center;padding:56px 20px;color:var(--sub)}
.emp i{font-size:40px;margin-bottom:12px;display:block;opacity:.4}
</style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="loginScreen">
  <div class="lcard">
    <div class="llogo">雨林資產認購平台</div>
    <div class="lsub">請以公司信箱登入，僅限內部員工使用</div>
    <div class="fd">
      <label>公司 Email</label>
      <input type="email" id="loginEmail" placeholder="yourname@rainforestretail.com.tw" autocomplete="email">
      <div class="hint">僅接受 @rainforestretail.com.tw 信箱</div>
    </div>
    <div class="fd">
      <label>驗證碼</label>
      <div class="orow">
        <input type="text" id="loginOtp" placeholder="輸入 6 位驗證碼" maxlength="6">
        <button onclick="sendOtp()">發送驗證碼</button>
      </div>
      <div class="hint" id="otpHint">（示範模式：任意填入 4 碼即可）</div>
    </div>
    <button class="bp" onclick="doLogin()">進入平台</button>
    <div class="lerr" id="loginErr">請填入正確的公司信箱並輸入驗證碼</div>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="app">
  <div class="shell">
    <div class="sb">
      <div class="sbh">
        <div class="sblogo">資產認購平台</div>
        <div class="sbsub">雨林新零售 · 內部限定</div>
      </div>
      <div class="sbnav">
        <div class="nsc">商品瀏覽</div>
        <div class="ni active" data-v="all" onclick="nav(this)"><i class="ti ti-layout-grid" aria-hidden="true"></i> 全部商品</div>
        <div class="ni" data-v="sell" onclick="nav(this)"><i class="ti ti-device-desktop" aria-hidden="true"></i> 整機販售</div>
        <div class="ni" data-v="part" onclick="nav(this)"><i class="ti ti-circuit-board" aria-hidden="true"></i> 零件拆售</div>
        <div class="ni" data-v="bid" onclick="nav(this)">
          <i class="ti ti-gavel" aria-hidden="true"></i> 競標專區
          <span class="nbadge" id="bidBadge">0</span>
        </div>
        <div class="nsc">管理</div>
        <div class="ni" data-v="admin" onclick="nav(this)"><i class="ti ti-layout-dashboard" aria-hidden="true"></i> 管理後台</div>
      </div>
      <div class="sbft"><i class="ti ti-user" aria-hidden="true"></i><span id="sbUser">—</span></div>
    </div>

    <div class="main">
      <div class="topbar">
        <div class="tbtitle" id="topTitle">全部商品</div>
        <div class="sw">
          <i class="ti ti-search" aria-hidden="true"></i>
          <input type="text" id="searchBox" placeholder="搜尋型號、規格…" oninput="renderGrid()">
        </div>
        <div class="chip"><i class="ti ti-shield-check" aria-hidden="true"></i><span id="chipUser">已驗證</span></div>
      </div>
      <div class="cnt">
        <div class="vw active" id="view-market">
          <div class="fbar">
            <button class="fb active" data-f="all" onclick="sf(this)">全部</button>
            <button class="fb" data-f="sell" onclick="sf(this)">整機販售</button>
            <button class="fb" data-f="part" onclick="sf(this)">零件拆售</button>
            <button class="fb" data-f="bid" onclick="sf(this)">競標</button>
            <button class="fb" data-f="available" onclick="sf(this)">有庫存</button>
            <span class="fc" id="fCount">載入中…</span>
          </div>
          <div class="grid" id="grid"></div>
        </div>
        <div class="vw" id="view-admin">
          <div class="srow" id="statRow"></div>
          <div class="atbar">
            <div class="atabs">
              <div class="atab active" onclick="atab('orders',this)">認購訂單</div>
              <div class="atab" onclick="atab('bids',this)">競標記錄</div>
            </div>
            <button class="exbtn" onclick="exportCSV()">
              <i class="ti ti-download" style="font-size:13px;vertical-align:-2px;margin-right:4px" aria-hidden="true"></i>匯出 CSV
            </button>
          </div>
          <div class="tcard">
            <div id="tabOrders">
              <table class="tt">
                <colgroup><col style="width:90px"><col style="width:180px"><col style="width:80px"><col style="width:170px"><col style="width:50px"><col style="width:80px"></colgroup>
                <thead><tr><th>時間</th><th>商品</th><th>員工</th><th>Email</th><th>數量</th><th>狀態</th></tr></thead>
                <tbody id="ordersBody"><tr><td colspan="6" class="etd">尚無訂單記錄</td></tr></tbody>
              </table>
            </div>
            <div id="tabBids" style="display:none">
              <table class="tt">
                <colgroup><col style="width:180px"><col style="width:80px"><col style="width:170px"><col style="width:100px"><col style="width:90px"></colgroup>
                <thead><tr><th>商品</th><th>出價者</th><th>Email</th><th>出價金額</th><th>時間</th></tr></thead>
                <tbody id="bidsBody"><tr><td colspan="5" class="etd">尚無競標記錄</td></tr></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ══ MODAL ══ -->
<div class="overlay" id="overlay" onclick="overlayClick(event)">
  <div class="modal">
    <div class="mhdr">
      <div class="mtitle" id="modalTitle">商品詳情</div>
      <button class="mclose" onclick="closeModal()" aria-label="關閉"><i class="ti ti-x"></i></button>
    </div>
    <div class="mbody" id="modalBody"></div>
  </div>
</div>

<!-- ══ 設備資料（只需改這個檔案）══ -->
<script src="ASSETS.js"></script>

<script>
/* ════════════════════════════════
   設定區 — 只需修改這裡
   ════════════════════════════════ */
const CONFIG = {
  domain: 'rainforestretail.com.tw',       // 公司信箱 domain
  companyName: '雨林新零售',                // 顯示名稱
  sheetsUrl: '',                            // Google Apps Script URL（串接後填入）
  pickupInfo: '台北辦公室 3F IT 倉庫，週一至週五 10:00–18:00', // 取貨說明
};

/* ════════════════════════════════
   以下不需修改
   ════════════════════════════════ */
const H = 3600000;
let curUser = '', activeF = 'all', activeAT = 'orders';
let orders = [], bids = [], tmrMap = {};

/* ── LOGIN ── */
function sendOtp() {
  const e = document.getElementById('loginEmail').value.trim();
  if (!e.endsWith('@' + CONFIG.domain)) { showErr('loginErr', '請填入正確的公司信箱'); return; }
  hideErr('loginErr');
  document.getElementById('otpHint').textContent = '驗證碼已寄出（示範模式：任意 4 碼即可）';
  // TODO: 正式版在此呼叫 Apps Script 寄送真實 OTP
  // fetch(CONFIG.sheetsUrl + '?action=sendOtp&email=' + e)
}

function doLogin() {
  const e = document.getElementById('loginEmail').value.trim();
  const o = document.getElementById('loginOtp').value.trim();
  if (!e.endsWith('@' + CONFIG.domain) || o.length < 4) { showErr('loginErr', '請填入正確的公司信箱並輸入驗證碼'); return; }
  hideErr('loginErr');
  curUser = e;
  const n = e.split('@')[0];
  document.getElementById('sbUser').textContent = n;
  document.getElementById('chipUser').textContent = n;
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('bidBadge').textContent = PRODUCTS.filter(p => p.type === 'bid').length;
  renderGrid(); renderStats(); startTimers();
}

function showErr(id, msg) { const el = document.getElementById(id); el.textContent = msg; el.style.display = 'block'; }
function hideErr(id) { document.getElementById(id).style.display = 'none'; }

/* ── NAV ── */
function nav(el) {
  document.querySelectorAll('.ni').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
  const v = el.dataset.v;
  const titles = { all: '全部商品', sell: '整機販售', part: '零件拆售', bid: '競標專區', admin: '管理後台' };
  document.getElementById('topTitle').textContent = titles[v];
  document.querySelectorAll('.vw').forEach(x => x.classList.remove('active'));
  if (v === 'admin') {
    document.getElementById('view-admin').classList.add('active');
    renderStats(); renderOrders(); renderBidsTab();
  } else {
    document.getElementById('view-market').classList.add('active');
    activeF = { all: 'all', sell: 'sell', part: 'part', bid: 'bid' }[v] || 'all';
    document.querySelectorAll('.fb').forEach(b => b.classList.remove('active'));
    const t = document.querySelector(`.fb[data-f="${activeF}"]`);
    if (t) t.classList.add('active');
    renderGrid();
  }
}

function sf(el) {
  activeF = el.dataset.f;
  document.querySelectorAll('.fb').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderGrid();
}

function filtered() {
  const q = document.getElementById('searchBox').value.toLowerCase();
  return PRODUCTS.filter(p => {
    const tok = activeF === 'all' ? true : activeF === 'available' ? (p.qty > 0) : p.type === activeF;
    const qok = !q || p.name.toLowerCase().includes(q) || p.spec.toLowerCase().includes(q) || p.model.toLowerCase().includes(q);
    return tok && qok;
  });
}

/* ── GRID ── */
function renderGrid() {
  const list = filtered();
  document.getElementById('fCount').textContent = list.length + ' 件';
  const g = document.getElementById('grid');
  if (!list.length) { g.innerHTML = '<div class="emp"><i class="ti ti-mood-empty" aria-hidden="true"></i><p>沒有符合條件的商品</p></div>'; return; }
  g.innerHTML = list.map(cardHTML).join('');
  startTimers();
}

function cardHTML(p) {
  const sold = p.qty === 0 && p.type !== 'bid';
  const tag = sold ? '<span class="ptag tdone">已售完</span>'
    : p.type === 'sell' ? '<span class="ptag ts">整機販售</span>'
    : p.type === 'part' ? '<span class="ptag tp">零件拆售</span>'
    : '<span class="ptag tb2">競標</span>';
  const qc = (p.qty > 0 && p.type !== 'bid') ? `<span class="qc">庫存 ${p.qty}</span>` : '';
  let ft = '';
  if (p.type === 'bid') {
    ft = `<div style="width:100%">
      <div class="tmr"><i class="ti ti-clock" aria-hidden="true"></i><span id="ct-${p.id}">計算中</span></div>
      <div class="brow">
        <div><div class="blab">目前最高出價</div><div class="bamt" id="ba-${p.id}">$${p.currentBid.toLocaleString()}</div><div class="bcnt" id="bc-${p.id}">${p.bidCount} 人出價</div></div>
        <button class="ab abbid" onclick="event.stopPropagation();openBid(${p.id})">立即出價</button>
      </div></div>`;
  } else {
    ft = `<div class="pp">$${p.price.toLocaleString()} <span>/ ${p.type === 'part' ? '個' : '台'}</span></div>
      ${!sold ? `<button class="ab" onclick="event.stopPropagation();openBuy(${p.id})">立即認購</button>` : '<span style="font-size:12px;color:#9ca3af">已售完</span>'}`;
  }
  return `<div class="pc" onclick="openDetail(${p.id})">
    <div class="pi" style="background:${p.color}"><i class="ti ${p.icon}" aria-hidden="true"></i>${tag}${qc}</div>
    <div class="pb"><div class="pn">${p.name}</div><div class="ps">${p.spec}</div><div class="pf">${ft}</div></div>
  </div>`;
}

/* ── TIMERS ── */
function startTimers() {
  PRODUCTS.filter(p => p.type === 'bid').forEach(p => {
    if (tmrMap[p.id]) clearInterval(tmrMap[p.id]);
    tmrMap[p.id] = setInterval(() => {
      const diff = p.endTime - Date.now();
      const el = document.getElementById('ct-' + p.id);
      if (!el) return;
      if (diff <= 0) { el.textContent = '已結束'; clearInterval(tmrMap[p.id]); return; }
      const h = Math.floor(diff / H), m = Math.floor((diff % H) / 60000), s = Math.floor((diff % 60000) / 1000);
      el.textContent = (h > 0 ? h + '小時 ' : '') + m + '分 ' + s + '秒';
    }, 1000);
  });
}

/* ── MODALS ── */
function sgHTML(p) {
  const pr = p.type === 'bid' ? p.startPrice : p.price;
  return `<div class="sg">
    <div class="si"><div class="sl">型號</div><div class="sv">${p.model}</div></div>
    <div class="si"><div class="sl">成色</div><div class="sv">${p.condition}</div></div>
    <div class="si"><div class="sl">規格</div><div class="sv" style="font-size:12px">${p.spec}</div></div>
    <div class="si"><div class="sl">${p.type === 'bid' ? '起標價格' : '庫存'}</div><div class="sv">${p.type === 'bid' ? '$' + pr.toLocaleString() : p.qty + (p.type === 'part' ? ' 個' : ' 台')}</div></div>
  </div>`;
}

function buyForm(p) {
  return `${sgHTML(p)}
  <div class="pline"><span class="pbig">$${p.price.toLocaleString()}</span><span class="pnote">/ ${p.type === 'part' ? '個' : '台'}（員工內購價）</span></div>
  <div class="fg"><label>您的姓名</label><input id="fn" placeholder="王小明"></div>
  <div class="fg"><label>公司 Email</label><input id="fe" value="${curUser}" readonly></div>
  <div class="fg"><label>數量</label><input type="number" id="fq" value="1" min="1" max="${p.qty}"></div>
  <div class="fg"><label>備註（選填）</label><textarea id="fr" placeholder="取貨方式、需要配件等…"></textarea></div>
  ${CONFIG.pickupInfo ? `<div style="font-size:12px;color:var(--sub);background:var(--bg);border-radius:var(--rs);padding:8px 10px;margin-bottom:14px"><i class="ti ti-map-pin" style="font-size:13px;vertical-align:-2px;margin-right:4px" aria-hidden="true"></i>${CONFIG.pickupInfo}</div>` : ''}
  <div class="sbar" id="sbar"><i class="ti ti-circle-check" style="margin-right:5px"></i>認購成功！管理員將與您確認取貨時間。</div>
  <button class="bp" onclick="submitOrder(${p.id})">確認認購</button>`;
}

function openDetail(id) { const p = PRODUCTS.find(x => x.id === id); if (p.type === 'bid') openBid(id); else { document.getElementById('modalTitle').textContent = p.name; document.getElementById('modalBody').innerHTML = buyForm(p); openModal(); } }
function openBuy(id) { openDetail(id); }

function openBid(id) {
  const p = PRODUCTS.find(x => x.id === id);
  document.getElementById('modalTitle').textContent = p.name + '　競標';
  const diff = p.endTime - Date.now();
  const h = Math.floor(diff / H), m = Math.floor((diff % H) / 60000), s = Math.floor((diff % 60000) / 1000);
  document.getElementById('modalBody').innerHTML = `${sgHTML(p)}
  <div class="bdisp"><div class="bdl">目前最高出價</div><div class="bda" id="mbAmt">$${p.currentBid.toLocaleString()}</div><div class="bdc" id="mbCnt">${p.bidCount} 人出價</div></div>
  <div class="cdrow">
    <div class="cdu"><span class="cdd" id="mch">${String(h).padStart(2, '0')}</span><div class="cdl">小時</div></div>
    <span class="cdsp">:</span>
    <div class="cdu"><span class="cdd" id="mcm">${String(m).padStart(2, '0')}</span><div class="cdl">分鐘</div></div>
    <span class="cdsp">:</span>
    <div class="cdu"><span class="cdd" id="mcs">${String(s).padStart(2, '0')}</span><div class="cdl">秒</div></div>
  </div>
  <div class="fg"><label>您的姓名</label><input id="fn" placeholder="王小明"></div>
  <div class="fg"><label>公司 Email</label><input id="fe" value="${curUser}" readonly></div>
  <div class="fg"><label>出價金額（最低 $${(p.currentBid + 200).toLocaleString()}，每次加 $200）</label>
    <input type="number" id="fbid" placeholder="${p.currentBid + 200}" min="${p.currentBid + 200}" step="200">
  </div>
  <div class="ebar" id="bidErr"></div>
  <div class="sbar" id="sbar"><i class="ti ti-circle-check" style="margin-right:5px"></i>出價成功！得標後管理員將聯繫您。</div>
  <button class="bp bam" onclick="submitBid(${id})">確認出價</button>`;
  openModal();
  const mt = setInterval(() => {
    if (!document.getElementById('overlay').classList.contains('open')) { clearInterval(mt); return; }
    const d2 = p.endTime - Date.now(); if (d2 <= 0) { clearInterval(mt); return; }
    const hh = Math.floor(d2 / H), mm = Math.floor((d2 % H) / 60000), ss = Math.floor((d2 % 60000) / 1000);
    const eh = document.getElementById('mch'), em = document.getElementById('mcm'), es = document.getElementById('mcs');
    if (eh) eh.textContent = String(hh).padStart(2, '0');
    if (em) em.textContent = String(mm).padStart(2, '0');
    if (es) es.textContent = String(ss).padStart(2, '0');
  }, 1000);
}

function openModal() { document.getElementById('overlay').classList.add('open'); }
function closeModal() { document.getElementById('overlay').classList.remove('open'); }
function overlayClick(e) { if (e.target === document.getElementById('overlay')) closeModal(); }

/* ── SUBMIT ── */
async function submitOrder(id) {
  const p = PRODUCTS.find(x => x.id === id);
  const name = document.getElementById('fn').value.trim();
  const qty = parseInt(document.getElementById('fq').value) || 1;
  const note = document.getElementById('fr').value.trim();
  if (!name) { alert('請填寫姓名'); return; }
  if (qty > p.qty) { alert('數量超出庫存'); return; }
  const order = { time: ts(), product: p.name, employee: name, email: curUser, qty, note };
  // 串接 Google Sheets（設定 CONFIG.sheetsUrl 後自動啟用）
  if (CONFIG.sheetsUrl) {
    try {
      await fetch(CONFIG.sheetsUrl, { method: 'POST', body: JSON.stringify({ action: 'order', ...order }) });
    } catch (e) { console.warn('Sheets 寫入失敗，僅本地記錄', e); }
  }
  orders.push(order);
  p.qty -= qty;
  document.getElementById('sbar').style.display = 'block';
  document.querySelector('#modalBody .bp').disabled = true;
  renderGrid(); renderStats();
  setTimeout(closeModal, 2200);
}

async function submitBid(id) {
  const p = PRODUCTS.find(x => x.id === id);
  const name = document.getElementById('fn').value.trim();
  const amt = parseInt(document.getElementById('fbid').value);
  const eb = document.getElementById('bidErr');
  if (!name) { eb.textContent = '請填寫姓名'; eb.style.display = 'block'; return; }
  if (!amt || amt <= p.currentBid) { eb.textContent = `出價須高於目前最高出價 $${p.currentBid.toLocaleString()}`; eb.style.display = 'block'; return; }
  eb.style.display = 'none';
  const bid = { time: ts(), product: p.name, employee: name, email: curUser, amount: amt };
  if (CONFIG.sheetsUrl) {
    try {
      await fetch(CONFIG.sheetsUrl, { method: 'POST', body: JSON.stringify({ action: 'bid', ...bid }) });
    } catch (e) { console.warn('Sheets 寫入失敗，僅本地記錄', e); }
  }
  bids.push(bid);
  p.currentBid = amt; p.bidCount++;
  const ba = document.getElementById('ba-' + id); if (ba) ba.textContent = '$' + amt.toLocaleString();
  const bc = document.getElementById('bc-' + id); if (bc) bc.textContent = p.bidCount + ' 人出價';
  const mb = document.getElementById('mbAmt'); if (mb) mb.textContent = '$' + amt.toLocaleString();
  document.getElementById('sbar').style.display = 'block';
  document.querySelector('#modalBody .bp').disabled = true;
  renderStats(); setTimeout(closeModal, 2200);
}

/* ── ADMIN ── */
function renderStats() {
  const tot = orders.reduce((a, o) => { const p = PRODUCTS.find(x => x.name === o.product); return a + (p ? (p.price || 0) * o.qty : 0); }, 0);
  document.getElementById('statRow').innerHTML = `
    <div class="scard"><div class="slb">商品總數</div><div class="svl">${PRODUCTS.length}</div><div class="ssu">上架中</div></div>
    <div class="scard"><div class="slb">認購訂單</div><div class="svl">${orders.length}</div><div class="ssu">筆</div></div>
    <div class="scard"><div class="slb">競標出價</div><div class="svl">${bids.length}</div><div class="ssu">筆</div></div>
    <div class="scard"><div class="slb">預估認購金額</div><div class="svl" style="font-size:18px">$${tot.toLocaleString()}</div><div class="ssu">員工認購</div></div>`;
}

function renderOrders() {
  const tb = document.getElementById('ordersBody');
  if (!orders.length) { tb.innerHTML = '<tr><td colspan="6" class="etd">尚無訂單記錄</td></tr>'; return; }
  tb.innerHTML = orders.map(o => `<tr><td>${o.time}</td><td title="${o.product}">${o.product}</td><td>${o.employee}</td><td style="color:var(--sub)">${o.email}</td><td>${o.qty}</td><td><span class="bdg bnew">新訂單</span></td></tr>`).join('');
}

function renderBidsTab() {
  const tb = document.getElementById('bidsBody');
  if (!bids.length) { tb.innerHTML = '<tr><td colspan="5" class="etd">尚無競標記錄</td></tr>'; return; }
  tb.innerHTML = bids.map(b => `<tr><td title="${b.product}">${b.product}</td><td>${b.employee}</td><td style="color:var(--sub)">${b.email}</td><td style="font-weight:500;color:var(--am)">$${b.amount.toLocaleString()}</td><td>${b.time}</td></tr>`).join('');
}

function atab(tab, el) {
  activeAT = tab;
  document.querySelectorAll('.atab').forEach(t => t.classList.remove('active')); el.classList.add('active');
  document.getElementById('tabOrders').style.display = tab === 'orders' ? 'block' : 'none';
  document.getElementById('tabBids').style.display = tab === 'bids' ? 'block' : 'none';
}

function exportCSV() {
  const rows = activeAT === 'orders'
    ? [['時間', '商品', '員工', 'Email', '數量'], ...orders.map(o => [o.time, o.product, o.employee, o.email, o.qty])]
    : [['商品', '出價者', 'Email', '金額', '時間'], ...bids.map(b => [b.product, b.employee, b.email, b.amount, b.time])];
  const csv = rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,\uFEFF' + encodeURIComponent(csv);
  a.download = (activeAT === 'orders' ? 'orders' : 'bids') + '_' + ts().replace(/:/g, '-') + '.csv';
  a.click();
}

function ts() { return new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit' }); }
</script>
</body>
</html>
